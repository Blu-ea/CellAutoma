[package]
name = "game_life"
version = "0.1.0"
edition = "2021"

default-run = "game_life"

[dependencies]
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

anyhow = "1" # – used for simple error handling
log = "0.4" # – used for logging statements
cgmath = "0.18" # – used as a Rust replacement for GLM (graphics math library)
png = "0.18.1" # – used to load PNGs to use as textures
pretty_env_logger = "0.5" # – used to print our logs to the console
thiserror = "1.0.69" # – used to define custom errors types without boilerplate
tobj = { version = "3", features = ["log"] } # – used to load 3D models in the Wavefront .obj format
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] } # – used to call the Vulkan API
winit = "0.29" # – used to create a window to render to
